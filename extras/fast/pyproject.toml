[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dictsqlite-fast"
version = "0.1.0"
description = "APSW ベースの DictSQLite 高速/互換拡張パッケージ"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [ { name = "Disnana" } ]
keywords = ["sqlite", "dict", "apsw", "database", "dictsqlite", "fast"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
# メインパッケージの util / crypto / safe_pickle を利用するため依存
# (同一リポジトリからインストールする場合、先に DictSQLite をインストールしておく)
dependencies = [
  "DictSQLite>=1.8.0",
  "portalocker",
  "cryptography",
  "apsw>=3.46.0.0"
]

[project.urls]
Homepage = "https://github.com/disnana/DictSQLite"

[tool.setuptools.packages.find]
where = ["."]
include = ["dictsqlite_fast", "dictsqlite_fast.*"]

