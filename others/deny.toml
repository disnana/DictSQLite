# others/deny.toml
[advisories]
# crates.io のセキュリティアドバイザリをチェック
vulnerability = "deny" # 見つけたらエラーにする

[bans]
# 二重依存やバージョン違いを禁止
multiple-versions = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
]

[sources]
# crates.io以外のソースを禁止する
unknown-registry = "deny"
unknown-git = "deny"
