[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    security: marks tests as security-related
    performance: marks tests as performance benchmarks
    integration: marks tests as integration tests

[coverage:run]
source = .
omit = 
    tests/*
    .venv/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[bandit]
exclude = .venv,target
skips = B101,B601
