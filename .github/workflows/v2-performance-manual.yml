name: DictSQLite v2 Performance Tests (Manual)
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of iterations per test'
        required: false
        default: '3'
      benchmark_profile:
        description: 'benchmark/benchmark_all.py profile'
        required: false
        default: 'quick'
        type: choice
        options:
          - quick
          - full
          - stress

jobs:
  build-and-test:
    name: Build and Performance Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      
      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            dictsqlite_v2/dictsqlite/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio
      
      - name: Build DictSQLite v4.2
        working-directory: dictsqlite_v2/dictsqlite
        run: |
          chmod +x build.sh
          ./build.sh
        env:
          CI: true
      
      - name: Run comprehensive performance tests
        working-directory: dictsqlite_v2/dictsqlite
        run: |
          python tests/test_v4.2_comprehensive_performance.py \
            --iterations ${{ github.event.inputs.iterations || '3' }} \
            --output performance_results_${{ matrix.os }}_py${{ matrix.python-version }}.json
      
      - name: Run pytest on entire tests folder
        working-directory: dictsqlite_v2/dictsqlite
        run: |
          pytest tests/ -v --tb=short
      
      - name: Upload performance results
        uses: actions/upload-artifact@v7
        with:
          name: performance-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dictsqlite_v2/dictsqlite/performance_results_*.json
          retention-days: 30
  
  benchmark-comparison:
    name: Benchmark v4.1 vs v4.2
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin
      
      - name: Build v4.1
        working-directory: dictsqlite_v2/dictsqlite
        run: |
          maturin build --release --strip
          pip install --force-reinstall target/wheels/*.whl
      
      - name: Run v4.1 baseline tests
        working-directory: dictsqlite_v2/dictsqlite
        run: |
          python tests/verify_optimization_opportunities.py > v4.1_results.txt || true
      
      - name: Build v4.2
        working-directory: dictsqlite_v2/dictsqlite
        run: |
          maturin build --release --strip
          pip install --force-reinstall target/wheels/*.whl
      
      - name: Run v4.2 optimized tests
        working-directory: dictsqlite_v2/dictsqlite
        run: |
          python tests/test_v4.2_comprehensive_performance.py \
            --iterations 5 \
            --output v4.2_results.json
      
      - name: Generate comparison report
        run: |
          python3 << 'EOF'
          import json
          import os
          
          print("="*80)
          print("DictSQLite v4.1 vs v4.2 Performance Comparison")
          print("="*80)
          
          # Try to load v4.2 results
          v42_file = "dictsqlite_v2/dictsqlite/v2_results.json"
          if os.path.exists(v42_file):
              with open(v42_file) as f:
                  v42_data = json.load(f)
              
              print(f"\nv4.2 Test Results ({v42_data.get('timestamp', 'N/A')}):")
              print(f"Total tests: {len(v42_data.get('tests', {}))}")
              
              # Show key performance metrics
              tests = v42_data.get('tests', {})
              for test_name in sorted(tests.keys()):
                  test_data = tests[test_name]
                  print(f"  {test_name}: {test_data['avg_time']:.3f}s")
          else:
              print("v2 results not found")
          
          print("\n" + "="*80)
          EOF
      
      - name: Upload comparison results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-comparison
          path: |
            dictsqlite_v2/dictsqlite/v2_results.txt
            dictsqlite_v2/dictsqlite/v2_results.json
          retention-days: 30

  benchmark-csv:
    name: Benchmark CSV and Comparison
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin matplotlib

      - name: Build and install DictSQLite
        working-directory: dictsqlite_v2/dictsqlite
        run: |
          maturin build --release --strip
          pip install --force-reinstall target/wheels/*.whl

      - name: Run benchmark suite
        working-directory: dictsqlite_v2/dictsqlite
        run: |
          python benchmark/benchmark_all.py --profile "${{ github.event.inputs.benchmark_profile || 'quick' }}"
          python benchmark/analyze_results.py
          python benchmark/export_for_github_action_benchmark.py \
            benchmark/benchmark_results.csv \
            benchmark/github_benchmark_results.json

      - name: Publish benchmark comparison
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customBiggerIsBetter
          output-file-path: dictsqlite_v2/dictsqlite/benchmark/github_benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          benchmark-data-dir-path: dictsqlite-v2-performance
          auto-push: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          summary-always: true
          alert-threshold: '1000%'
          comment-on-alert: false
          fail-on-alert: false

      - name: Add benchmark summary
        run: |
          python - <<'PY'
          import csv
          import os

          profile = "${{ github.event.inputs.benchmark_profile || 'quick' }}"
          path = "dictsqlite_v2/dictsqlite/benchmark/benchmark_results.csv"
          rows = []
          with open(path, encoding="utf-8") as f:
              rows.extend(csv.DictReader(f))
          rows.sort(key=lambda r: float(r.get("p95_time_ms", 0) or 0), reverse=True)

          lines = [
              "## DictSQLite v2 benchmark",
              "",
              f"- Profile: {profile}",
              "- CSV: `dictsqlite_v2/dictsqlite/benchmark/benchmark_results.csv`",
              "- GitHub benchmark JSON: `dictsqlite_v2/dictsqlite/benchmark/github_benchmark_results.json`",
              "- Benchmark alerts are disabled to avoid false positives from GitHub runner variance.",
              "",
              "### Slowest p95 rows",
              "",
              "| category | operation | scenario | mode | store | p95 ms | ops/sec |",
              "|---|---|---|---|---|---:|---:|",
          ]

          for row in rows[:10]:
              lines.append(
                  f"| {row['category']} | {row['operation']} | {row.get('scenario','')} | "
                  f"{row.get('persist_mode','')} | {row.get('storage_mode','')} | "
                  f"{float(row.get('p95_time_ms', 0) or 0):.3f} | "
                  f"{float(row.get('ops_per_sec', 0) or 0):.1f} |"
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines))
              f.write("\n")
          PY

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-csv-and-graphs
          path: |
            dictsqlite_v2/dictsqlite/benchmark/benchmark_results.csv
            dictsqlite_v2/dictsqlite/benchmark/github_benchmark_results.json
            dictsqlite_v2/dictsqlite/benchmark/benchmark_report.txt
            dictsqlite_v2/dictsqlite/benchmark/images/*.png
          retention-days: 30

  arm-benchmark:
    name: ARM Performance Benchmark
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build ARM64 wheel with maturin
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: dictsqlite_v2/dictsqlite
          manylinux: auto

      - name: Set up QEMU for ARM emulation (test only)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Run ARM benchmark in Docker
        run: |
          echo "Running benchmark on ARM64 (linux/arm64)"
          
          docker run --platform linux/arm64 --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            python:3.11-slim \
            bash -c "
              apt-get update && apt-get install -y python3-pip &&
              pip install --break-system-packages pytest pytest-asyncio &&
              pip install --break-system-packages /workspace/dictsqlite_v2/dictsqlite/dist/*.whl &&
              cd /workspace/dictsqlite_v2/dictsqlite &&
              python3 tests/test_v4.2_comprehensive_performance.py \
                --iterations ${{ github.event.inputs.iterations || '1' }} \
                --output /workspace/performance_results_ARM64_py3.11.json
            "

      - name: Upload ARM performance results
        uses: actions/upload-artifact@v7
        with:
          name: performance-results-${{ matrix.target }}-py3.11
          path: performance_results_*.json
          retention-days: 30

  security-check:
    name: Security and Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      
      - name: Run Clippy
        working-directory: dictsqlite_v2/dictsqlite
        run: cargo clippy -- -D warnings || true
      
      - name: Run Cargo Audit
        working-directory: dictsqlite_v2/dictsqlite
        run: |
          cargo install cargo-audit || true
          cargo audit || true
      
      - name: Check formatting
        working-directory: dictsqlite_v2/dictsqlite
        run: cargo fmt --check || true

  performance-report:
    name: Performance Report
    runs-on: ubuntu-latest
    needs: [build-and-test, benchmark-comparison, benchmark-csv, arm-benchmark, security-check]
    if: always()

    steps:
      - name: Download benchmark artifact
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: benchmark-csv-and-graphs
          path: benchmark-summary-artifact

      - name: Write final workflow summary
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          profile = "${{ github.event.inputs.benchmark_profile || 'quick' }}"
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          csv_path = Path("benchmark-summary-artifact/benchmark_results.csv")

          lines = [
              "## DictSQLite v2 performance workflow result",
              "",
              f"- Benchmark profile: {profile}",
              "",
              "| Job | Result |",
              "|---|---|",
              "| build-and-test | ${{ needs.build-and-test.result }} |",
              "| benchmark-comparison | ${{ needs.benchmark-comparison.result }} |",
              "| benchmark-csv | ${{ needs.benchmark-csv.result }} |",
              "| arm-benchmark | ${{ needs.arm-benchmark.result }} |",
              "| security-check | ${{ needs.security-check.result }} |",
              "",
              "Benchmark alerts are disabled to avoid false positives from GitHub runner variance.",
          ]

          if csv_path.exists():
              rows = list(csv.DictReader(csv_path.open(encoding="utf-8")))
              slow = sorted(rows, key=lambda r: float(r.get("p95_time_ms", 0) or 0), reverse=True)[:10]
              fast = sorted(rows, key=lambda r: float(r.get("ops_per_sec", 0) or 0), reverse=True)[:10]

              lines += [
                  "",
                  "### Slowest p95 latency",
                  "",
                  "| category | operation | scenario | mode | store | p95 ms | ops/sec |",
                  "|---|---|---|---|---|---:|---:|",
              ]
              for row in slow:
                  lines.append(
                      f"| {row.get('category','')} | {row.get('operation','')} | {row.get('scenario','')} | "
                      f"{row.get('persist_mode','')} | {row.get('storage_mode','')} | "
                      f"{float(row.get('p95_time_ms', 0) or 0):.3f} | "
                      f"{float(row.get('ops_per_sec', 0) or 0):.1f} |"
                  )

              lines += [
                  "",
                  "### Fastest throughput",
                  "",
                  "| category | operation | scenario | mode | store | ops/sec | p95 ms |",
                  "|---|---|---|---|---|---:|---:|",
              ]
              for row in fast:
                  lines.append(
                      f"| {row.get('category','')} | {row.get('operation','')} | {row.get('scenario','')} | "
                      f"{row.get('persist_mode','')} | {row.get('storage_mode','')} | "
                      f"{float(row.get('ops_per_sec', 0) or 0):.1f} | "
                      f"{float(row.get('p95_time_ms', 0) or 0):.3f} |"
                  )

              lines += [
                  "",
                  "### Artifacts",
                  "",
                  "- `benchmark_results.csv`",
                  "- `github_benchmark_results.json`",
                  "- `benchmark_report.txt`",
                  "- graph images under `images/*.png`",
              ]
          else:
              lines += [
                  "",
                  "### Benchmark result",
                  "",
                  "Benchmark CSV artifact was not available. Check the `benchmark-csv` job logs/artifacts.",
              ]

          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
