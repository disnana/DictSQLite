# パフォーマンスベンチマークワークフロー
# 
# このワークフローはdictsqlite (オリジナル版) と dictsqlite_v2 の
# 2つのバージョンを最適化されたテストでベンチマークします。
#
# 実行モード:
# - 自動実行: プッシュ/PRで高速モード（両方テスト）
# - 手動実行: 高速モードまたは完全モード選択可能

name: Performance Benchmark

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'dictsqlite/**'
      - 'dictsqlite-fastest/dictsqlite_v2/**'
      - 'others/benchmark/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'dictsqlite/**'
      - 'dictsqlite-fastest/dictsqlite_v2/**'
      - 'others/benchmark/**'
  workflow_dispatch:  # 手動実行
    inputs:
      test_mode:
        description: 'テストモード選択'
        required: true
        default: 'fast'
        type: choice
        options:
          - 'fast'
          - 'full'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk fonts-ipafont fonts-ipaexfont

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install matplotlib seaborn pandas numpy plotly kaleido
        pip install -e .

    - name: Determine test mode
      id: test_mode
      run: |
        # イベントタイプに応じてテストモードを決定
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          # 手動実行: ユーザーが選択したモード
          echo "mode=${{ github.event.inputs.test_mode }}" >> $GITHUB_OUTPUT
        else
          # 自動実行 (push/PR): 常に高速モード
          echo "mode=fast" >> $GITHUB_OUTPUT
        fi

    - name: Run optimized benchmark
      run: |
        cd others/benchmark
        
        TEST_MODE="${{ steps.test_mode.outputs.mode }}"
        echo "🚀 実行モード: $TEST_MODE"
        
        if [ "$TEST_MODE" == "fast" ]; then
          echo "⚡ 高速ベンチマークを実行中..."
        else
          echo "🔬 完全ベンチマークを実行中..."
        fi
        
        python optimized_benchmark.py --mode $TEST_MODE
      env:
        PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/dictsqlite-fastest
      continue-on-error: false

    - name: Generate benchmark visualizations
      run: |
        cd others/benchmark
        # 最新のベンチマーク結果CSVファイルを探す
        LATEST_CSV=$(ls -t results/*.csv 2>/dev/null | head -n1)
        if [ -n "$LATEST_CSV" ]; then
          echo "Visualizing: $LATEST_CSV"
          # visualize_benchmark.pyが存在すれば実行
          if [ -f "visualize_benchmark.py" ]; then
            python visualize_benchmark.py "$LATEST_CSV" || echo "Visualization failed, continuing..."
          else
            echo "visualize_benchmark.py not found, skipping visualization"
          fi
        else
          echo "No CSV file found in results/, skipping visualization"
        fi
      env:
        PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/dictsqlite-fastest
      continue-on-error: true

    - name: List benchmark results
      run: |
        echo "=== Benchmark Results (Mode: ${{ steps.test_mode.outputs.mode }}) ==="
        ls -lh others/benchmark/results/
        echo ""
        echo "=== Graphs ==="
        if [ -d "others/benchmark/results/graphs" ]; then
          ls -lh others/benchmark/results/graphs/
        else
          echo "No graphs directory"
        fi

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-${{ matrix.python-version }}
        path: |
          others/benchmark/results/*.csv
          others/benchmark/results/*.json
          others/benchmark/results/*.log
          others/benchmark/results/*.md
          others/benchmark/results/graphs/*.png
          others/benchmark/results/graphs/*.html
        retention-days: 90

    - name: Create benchmark summary
      run: |
        SUMMARY_FILE="others/benchmark/results/BENCHMARK_SUMMARY.md"
        if [ -f "$SUMMARY_FILE" ]; then
          echo "## 📊 Benchmark Results" >> $GITHUB_STEP_SUMMARY
          cat "$SUMMARY_FILE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*手動実行されたベンチマーク - $(date)*" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Display benchmark info
      run: |
        echo "✅ ベンチマーク実行完了！"
        echo ""
        echo "📊 テストモード: ${{ steps.test_mode.outputs.mode }}"
        echo "🎯 テスト対象:"
        echo "  - DictSQLite (オリジナル版)"
        echo "  - DictSQLiteV2 (v2.0版)"
        echo ""
        echo "📊 結果は以下の場所で確認できます:"
        echo "  1. このワークフロー実行ページの 'Artifacts' セクション"
        echo "  2. 上部の 'Summary' タブ"
        echo "  3. リポジトリの others/benchmark/results/ ディレクトリ（コミット後）"
        echo ""
        echo "💾 結果ファイル:"
        if [ -d "others/benchmark/results" ]; then
          find others/benchmark/results -type f -name "*.csv" -o -name "*.json" -o -name "*.md" -o -name "*.png" | head -20
        fi

    - name: Commit and push benchmark results
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # ベンチマーク結果を追加
        git add others/benchmark/results/
        
        # 変更があればコミット
        if git diff --staged --quiet; then
          echo "コミットする変更がありません"
        else
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          MODE="${{ steps.test_mode.outputs.mode }}"
          git commit -m "📊 ベンチマーク結果を追加 (モード: $MODE) - ${TIMESTAMP} [skip ci]"
          git push
          echo "✅ ベンチマーク結果をリポジトリにコミットしました"
        fi
      continue-on-error: true
