# パフォーマンスベンチマークワークフロー
# 
# このワークフローは負荷が大きいため、手動実行のみ許可されています。
# 実行方法: GitHub の「Actions」タブ → 「Performance Benchmark」→ 「Run workflow」
#
# DictSQLite、DictSQLite-Fastest、DictSQLite-Fastest Beta の
# 3つのバージョンを包括的にベンチマークし、結果をグラフ化します。

name: Performance Benchmark

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:  # 手動実行のみ許可（負荷が大きいため）
    inputs:
      run_full_benchmark:
        description: 'フル機能ベンチマークを実行（時間がかかります）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # パフォーマンステストは負荷が大きいため、手動実行のみ許可
    # GitHub Actionsの「Actions」タブから「Performance Benchmark」を選択して実行してください
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk fonts-ipafont fonts-ipaexfont

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install matplotlib seaborn pandas numpy plotly kaleido
        # dictsqlite-fastest の依存関係（apsw, zstandard等）
        pip install apsw zstandard
        pip install -e .
        # dictsqlite-fastest の依存関係をインストール（パッケージとしてではなく）
        if [ -f "dictsqlite-fastest/requirements.txt" ]; then
          pip install -r dictsqlite-fastest/requirements.txt
        fi
        # dictsqlite-fastest beta の依存関係をインストール
        if [ -f "dictsqlite-fastest/beta/requirements.txt" ]; then
          pip install -r dictsqlite-fastest/beta/requirements.txt
        fi

    - name: Run fast comprehensive benchmark
      run: |
        cd others/benchmark
        python fast_comprehensive_benchmark.py
      env:
        PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/dictsqlite-fastest:${{ github.workspace }}/dictsqlite-fastest/beta
      continue-on-error: false

    - name: Generate benchmark visualizations
      run: |
        cd others/benchmark
        # 最新のベンチマーク結果CSVファイルを探す
        LATEST_CSV=$(ls -t ../../benchmark_results/*.csv 2>/dev/null | head -n1)
        if [ -n "$LATEST_CSV" ]; then
          echo "Visualizing: $LATEST_CSV"
          python visualize_benchmark.py "$LATEST_CSV"
        else
          echo "No CSV file found in benchmark_results/"
          exit 1
        fi
      env:
        PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/dictsqlite-fastest:${{ github.workspace }}/dictsqlite-fastest/beta
      continue-on-error: false

    - name: List benchmark results
      run: |
        echo "=== Benchmark Results ==="
        ls -lh benchmark_results/
        echo ""
        echo "=== Graphs ==="
        if [ -d "benchmark_results/graphs" ]; then
          ls -lh benchmark_results/graphs/
        fi

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-${{ matrix.python-version }}
        path: |
          benchmark_results/*.csv
          benchmark_results/*.json
          benchmark_results/*.log
          benchmark_results/*.md
          benchmark_results/graphs/*.png
          benchmark_results/graphs/*.html
        retention-days: 90

    - name: Create benchmark summary
      run: |
        SUMMARY_FILE="benchmark_results/BENCHMARK_SUMMARY.md"
        if [ -f "$SUMMARY_FILE" ]; then
          echo "## 📊 Benchmark Results" >> $GITHUB_STEP_SUMMARY
          cat "$SUMMARY_FILE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*手動実行されたベンチマーク - $(date)*" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Display benchmark info
      run: |
        echo "✅ ベンチマーク実行完了！"
        echo ""
        echo "📊 結果は以下の場所で確認できます:"
        echo "  1. このワークフロー実行ページの 'Artifacts' セクション"
        echo "  2. 上部の 'Summary' タブ"
        echo ""
        echo "💾 結果ファイル:"
        if [ -d "benchmark_results" ]; then
          find benchmark_results -type f -name "*.csv" -o -name "*.json" -o -name "*.md" -o -name "*.png" | head -20
        fi
