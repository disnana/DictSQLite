# パフォーマンスベンチマークワークフロー
# 
# このワークフローは負荷が大きいため、手動実行のみ許可されています。
# 実行方法: GitHub の「Actions」タブ → 「Performance Benchmark」→ 「Run workflow」
#
# テスト対象の選択オプション:
# - all: 3つの主要バージョンを比較 (Original, dictsqlite_v2, Beta v2)
#   → Original版 (dictsqlite/) - 標準sqlite3ベース
#   → dictsqlite_v2版 (dictsqlite_v2/dictsqlite/) - Rust拡張 v2.0.6 (同期・非同期対応)
#     * 3モード個別テスト: memory, lazy, writethrough
#     * 各モード同期・非同期テスト: Write, Read, Mixed, Update, Async Write, Async Read, Concurrent
#     * メモリ使用量プロファイリング
#     * fastest版との詳細比較
#   → Beta v2版 (dictsqlite-fastest beta v2) - APSWベース非同期高性能版
#
# - v1, v2, v3, v4: dictsqlite-fastest Betaの各リビジョンをテスト
#   → v1: dictsqlite-fastest beta v1
#   → v2: dictsqlite-fastest beta v2
#   → v3: dictsqlite-fastest beta v3-alpha
#   → v4: dictsqlite-fastest beta v4-final
#
# ビルドされるRust拡張:
# - dictsqlite_v2: dictsqlite_v2/dictsqlite/ フォルダ - バージョン 2.0.6 (Rust拡張)
# - dictsqlite_v4.1: others/beta-versions/dictsqlite_v4.1/ - v4.1 Rust実装 (v1-v4モードのみ使用)

name: Performance Benchmark

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:  # 手動実行のみ許可（負荷が大きいため）
    inputs:
      run_full_benchmark:
        description: 'フル機能ベンチマークを実行（時間がかかります）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      beta_version:
        description: 'テスト対象の選択'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'v1'
          - 'v2'
          - 'v3'
          - 'v4'

jobs:
  # Rust拡張のビルドを並列化
  build-rust-extensions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extension:
          - name: "v4.1"
            path: "others/beta-versions/dictsqlite_v4.1"
            package: "dictsqlite_v4"
          - name: "v2"
            path: "dictsqlite_v2/dictsqlite"
            package: "dictsqlite"
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Build Rust extension for ${{ matrix.extension.name }}
      run: |
        pip install maturin
        cd ${{ matrix.extension.path }}
        echo "🔨 Building Rust ${{ matrix.extension.name }} extension..."
        echo "Current directory: $(pwd)"
        echo "Checking for Cargo.toml: $(ls -la Cargo.toml 2>&1 || echo 'NOT FOUND')"
        maturin build --release
        echo "✅ Rust ${{ matrix.extension.name }} extension built successfully"

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4.4.3
      with:
        name: wheel-${{ matrix.extension.name }}
        path: ${{ matrix.extension.path }}/target/wheels/*.whl
        retention-days: 1

  benchmark:
    needs: build-rust-extensions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    
    env:
      # Note: Do NOT include ${{ github.workspace }} directly as it shadows V2 wheel with Original dictsqlite/
      PYTHONPATH: ${{ github.workspace }}/others/beta-versions/dictsqlite-fastest:${{ github.workspace }}/others/beta-versions/dictsqlite-fastest/beta

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk fonts-ipafont fonts-ipaexfont

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install matplotlib seaborn pandas numpy plotly kaleido
        # dictsqlite-fastest の依存関係（apsw, zstandard等）
        pip install apsw zstandard
        # v2用の依存関係（aiosqlite）
        pip install aiosqlite
        # Note: Do NOT install original dictsqlite with "pip install -e ." here
        # as it shadows the V2 wheel. Benchmark scripts access original version
        # directly via sys.path manipulation (see benchmark_v2_comprehensive.py:105-106)
        # dictsqlite-fastest の依存関係をインストール（パッケージとしてではなく）
        if [ -f "others/beta-versions/dictsqlite-fastest/requirements.txt" ]; then
          pip install -r others/beta-versions/dictsqlite-fastest/requirements.txt
        fi
        # dictsqlite-fastest beta の依存関係をインストール
        if [ -f "others/beta-versions/dictsqlite-fastest/beta/requirements.txt" ]; then
          pip install -r others/beta-versions/dictsqlite-fastest/beta/requirements.txt
        fi
        pip install maturin

    - name: Download v4.1 wheel
      uses: actions/download-artifact@v4.1.3
      with:
        name: wheel-v4.1
        path: ./wheels/v4.1

    - name: Download v2 wheel
      uses: actions/download-artifact@v4.1.3
      with:
        name: wheel-v2
        path: ./wheels/v2

    - name: Install Rust extensions
      run: |
        echo "📦 Installing Rust v4.1 extension..."
        # Verify exactly one wheel file exists
        WHEEL_COUNT=$(ls -1 ./wheels/v4.1/dictsqlite_v4-*.whl 2>/dev/null | wc -l)
        if [ "$WHEEL_COUNT" -eq 0 ]; then
          echo "❌ Error: No v4.1 wheel file found"
          exit 1
        elif [ "$WHEEL_COUNT" -gt 1 ]; then
          echo "⚠️ Warning: Multiple v4.1 wheel files found, using first one"
          ls -1 ./wheels/v4.1/dictsqlite_v4-*.whl
        fi
        pip install --force-reinstall ./wheels/v4.1/dictsqlite_v4-*.whl
        echo "✅ Rust v4.1 extension installed"
        
        echo "📦 Installing dictsqlite_v2 extension..."
        # Verify exactly one wheel file exists
        WHEEL_COUNT=$(ls -1 ./wheels/v2/dictsqlite-*.whl 2>/dev/null | wc -l)
        if [ "$WHEEL_COUNT" -eq 0 ]; then
          echo "❌ Error: No v2 wheel file found"
          exit 1
        elif [ "$WHEEL_COUNT" -gt 1 ]; then
          echo "⚠️ Warning: Multiple v2 wheel files found, using first one"
          ls -1 ./wheels/v2/dictsqlite-*.whl
        fi
        pip install --force-reinstall ./wheels/v2/dictsqlite-*.whl
        echo "✅ dictsqlite_v2 extension installed"

    - name: Display version information
      run: |
        echo "=== バージョン情報 ==="
        echo "Python: $(python --version)"
        echo ""
        echo "選択されたテスト対象: ${{ github.event.inputs.beta_version }}"
        echo ""
        
        if [ "${{ github.event.inputs.beta_version }}" == "all" ]; then
          echo "テスト内容: 3つの主要バージョンを比較"
          echo "  - Original版 (dictsqlite/) - 標準sqlite3ベース（同期処理のみ）"
          echo "  - dictsqlite_v2版 (dictsqlite_v2/dictsqlite/) - Rust拡張 v2.0.6（同期・非同期対応）"
          echo "    * 3モード個別テスト: memory, lazy, writethrough"
          echo "    * 各モード同期・非同期テスト: Write, Read, Mixed, Update, Async Write, Async Read, Concurrent"
          echo "    * メモリ使用量プロファイリング"
          echo "    * 総合7テスト × 3モード = 21テストケース"
          echo "  - Beta v2版 (dictsqlite-fastest beta v2) - APSWベース非同期高性能版"
        else
          echo "テスト内容: dictsqlite-fastest Beta ${{ github.event.inputs.beta_version }} のみ"
          echo "  - Original版との比較"
          echo "  - Fastest版との比較"
        fi
        echo ""
        echo "インストール済みパッケージ:"
        echo ""
        echo "DictSQLite (Original):"
        python -c "import dictsqlite.main; print(f'  Version: {dictsqlite.main.__version__}')" || echo "  インポートエラー"
        echo ""
        echo "dictsqlite_v2 (Rust拡張):"
        echo "  pyproject.toml バージョン: 2.0.6"
        python -c "import dictsqlite; print(f'  インポート成功')" || echo "  インポートエラー"
        echo ""
        echo "dictsqlite_v4.1 (Rust拡張):"
        python -c "from dictsqlite_v4 import DictSQLiteV4; print(f'  インポート成功')" || echo "  インポートエラー"
        echo ""
        echo "Beta Version: ${{ github.event.inputs.beta_version }}"
        echo "======================================"

    - name: Run fast comprehensive benchmark
      run: |
        cd others/benchmark
        
        # テスト対象の選択
        # Note: BETA_VERSION という変数名ですが、"all" を含む全テスト対象に使用されます
        BETA_VERSION="${{ github.event.inputs.beta_version }}"
        echo "📦 選択されたテスト対象: $BETA_VERSION"
        
        # BETA_VERSIONを環境変数としてエクスポート（バージョン管理システムとベンチマークスクリプトで使用）
        export BETA_VERSION
        
        # 結果ディレクトリを事前に作成
        mkdir -p results/versions
        mkdir -p results/graphs
        mkdir -p results/comparisons
        mkdir -p results/v2_modes
        
        if [ "$BETA_VERSION" == "all" ]; then
          echo "🔬 dictsqlite_v2 包括的パフォーマンスベンチマークを実行..."
          echo ""
          echo "📊 テスト内容:"
          echo "  - 3つの永続化モード: memory, lazy, writethrough"
          echo "  - 2つのストレージモード: pickle, bytes"
          echo "  - 同期/非同期テスト: set, get, batch_set, batch_get"
          echo "  - TableProxy操作"
          echo "  - スコアリングとランキング"
          echo ""
          
          # メイン包括的ベンチマーク (v2)
          python benchmark_v2_comprehensive.py || {
            echo "❌ ベンチマーク実行エラー"
            exit 1
          }
          
          echo ""
          echo "🔬 追加比較テストを実行..."
          
          # v2 vs fastest 比較（オプショナル）
          python comprehensive_v2_vs_fastest.py > results/v2_modes/comprehensive_comparison.log 2>&1 || {
            echo "⚠️ v2 vs fastest比較スキップ（継続）"
          }
          
          # 全モード総合テスト（オプショナル）
          python comprehensive_v2_all_modes.py > results/v2_modes/comprehensive_all_modes.log 2>&1 || {
            echo "⚠️ 全モード総合テストスキップ（継続）"
          }
        elif [ "$BETA_VERSION" == "v2" ]; then
          echo "🔄 dictsqlite-fastest Beta v2 をテスト中..."
          sed -i 's/from dictsqlite_fastest_beta import/from dictsqlite_fastest_beta_v2 import/g' comprehensive_benchmark.py || true
          sed -i 's/from dictsqlite_fastest_beta import/from dictsqlite_fastest_beta_v2 import/g' fast_comprehensive_benchmark.py || true
          
          if [ "${{ github.event.inputs.run_full_benchmark }}" == "true" ]; then
            echo "🔬 フル機能ベンチマーク (dictsqlite-fastest Beta v2) を実行中..."
            python comprehensive_benchmark.py || {
              echo "❌ ベンチマーク実行エラー"
              exit 1
            }
          else
            echo "⚡ 高速ベンチマーク (dictsqlite-fastest Beta v2) を実行中..."
            python fast_comprehensive_benchmark.py || {
              echo "❌ ベンチマーク実行エラー"
              exit 1
            }
          fi
        elif [ "$BETA_VERSION" == "v3" ]; then
          echo "🔄 dictsqlite-fastest Beta v3-alpha をテスト中..."
          sed -i 's/from dictsqlite_fastest_beta import/from dictsqlite_fastest_beta_v3_alpha import/g' comprehensive_benchmark.py || true
          sed -i 's/from dictsqlite_fastest_beta import/from dictsqlite_fastest_beta_v3_alpha import/g' fast_comprehensive_benchmark.py || true
          
          if [ "${{ github.event.inputs.run_full_benchmark }}" == "true" ]; then
            echo "🔬 フル機能ベンチマーク (dictsqlite-fastest Beta v3) を実行中..."
            python comprehensive_benchmark.py || {
              echo "❌ ベンチマーク実行エラー"
              exit 1
            }
          else
            echo "⚡ 高速ベンチマーク (dictsqlite-fastest Beta v3) を実行中..."
            python fast_comprehensive_benchmark.py || {
              echo "❌ ベンチマーク実行エラー"
              exit 1
            }
          fi
        elif [ "$BETA_VERSION" == "v4" ]; then
          echo "🔄 dictsqlite-fastest Beta v4-final をテスト中..."
          sed -i 's/from dictsqlite_fastest_beta import/from dictsqlite_fastest_beta_v4_final import/g' comprehensive_benchmark.py || true
          sed -i 's/from dictsqlite_fastest_beta import/from dictsqlite_fastest_beta_v4_final import/g' fast_comprehensive_benchmark.py || true
          
          if [ "${{ github.event.inputs.run_full_benchmark }}" == "true" ]; then
            echo "🔬 フル機能ベンチマーク (dictsqlite-fastest Beta v4) を実行中..."
            python comprehensive_benchmark.py || {
              echo "❌ ベンチマーク実行エラー"
              exit 1
            }
          else
            echo "⚡ 高速ベンチマーク (dictsqlite-fastest Beta v4) を実行中..."
            python fast_comprehensive_benchmark.py || {
              echo "❌ ベンチマーク実行エラー"
              exit 1
            }
          fi
        else
          # v1の場合
          if [ "${{ github.event.inputs.run_full_benchmark }}" == "true" ]; then
            echo "🔬 フル機能ベンチマーク (dictsqlite-fastest Beta v1) を実行中..."
            python comprehensive_benchmark.py || {
              echo "❌ ベンチマーク実行エラー"
              exit 1
            }
          else
            echo "⚡ 高速ベンチマーク (dictsqlite-fastest Beta v1) を実行中..."
            python fast_comprehensive_benchmark.py || {
              echo "❌ ベンチマーク実行エラー"
              exit 1
            }
          fi
        fi
        
        # CSV ファイルの検証
        echo "📊 CSV ファイルの検証..."
        if ls results/*.csv 1> /dev/null 2>&1; then
          for csv_file in results/*.csv; do
            if [ -f "$csv_file" ]; then
              lines=$(wc -l < "$csv_file")
              echo "  ✓ $csv_file ($lines lines)"
            fi
          done
        else
          echo "  ⚠️ CSV ファイルが見つかりません"
        fi
      env:
        BETA_VERSION: ${{ github.event.inputs.beta_version }}
      continue-on-error: false

    # グラフはベンチマーク実行時に自動生成されるため、このステップは不要
    
    - name: Generate version comparison
      run: |
        cd others/benchmark
        echo "📊 バージョン間比較を生成中..."
        python compare_versions.py || echo "⚠️ バージョン比較の生成に失敗しました（初回実行の場合は正常）"
      continue-on-error: true

    - name: List benchmark results
      run: |
        echo "=== Benchmark Results (Beta Version: ${{ github.event.inputs.beta_version }}) ==="
        ls -lh others/benchmark/results/
        echo ""
        echo "=== Version-specific Results ==="
        if [ -d "others/benchmark/results/versions" ]; then
          ls -lh others/benchmark/results/versions/
          echo ""
          echo "=== Files in Version Directory ==="
          VERSION_DIR="others/benchmark/results/versions/${{ github.event.inputs.beta_version }}"
          if [ -d "$VERSION_DIR" ]; then
            ls -lh "$VERSION_DIR"/
            if [ -d "$VERSION_DIR/graphs" ]; then
              echo ""
              echo "=== Graphs in Version Directory ==="
              ls -lh "$VERSION_DIR/graphs/"
            fi
          fi
        fi
        echo ""
        echo "=== Version Comparisons ==="
        if [ -d "others/benchmark/results/comparisons" ]; then
          ls -lh others/benchmark/results/comparisons/
        fi
        echo ""
        echo "=== dictsqlite_v2 Mode Tests ==="
        if [ -d "others/benchmark/results/v2_modes" ]; then
          ls -lh others/benchmark/results/v2_modes/
          echo ""
          echo "=== v2 Comprehensive Comparison Log ==="
          if [ -f "others/benchmark/results/v2_modes/comprehensive_comparison.log" ]; then
            echo "📊 Showing v2 vs fastest comparison results:"
            tail -50 others/benchmark/results/v2_modes/comprehensive_comparison.log
          fi
          echo ""
          echo "=== v2 All Modes Comprehensive Log ==="
          if [ -f "others/benchmark/results/v2_modes/comprehensive_all_modes.log" ]; then
            echo "📊 Showing all modes (sync/async) results:"
            tail -80 others/benchmark/results/v2_modes/comprehensive_all_modes.log
          fi
        fi

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4.4.3
      with:
        name: benchmark-results-${{ matrix.python-version }}
        path: |
          others/benchmark/results/*.csv
          others/benchmark/results/*.json
          others/benchmark/results/*.log
          others/benchmark/results/*.md
          others/benchmark/results/graphs/*.png
          others/benchmark/results/graphs/*.html
          others/benchmark/results/versions/**/*
          others/benchmark/results/comparisons/**/*
          others/benchmark/results/v2_modes/**/*
          others/benchmark/results/v2_comprehensive/**/*
          others/benchmark/results/v2_comprehensive/images/**/*
        retention-days: 90

    - name: Create benchmark summary
      run: |
        # サマリーファイルを作成
        SUMMARY_TMP="/tmp/benchmark_summary.md"
        
        # ランク表示のためのヘルパー関数
        format_rank() {
          local rank=$1
          local name=$2
          local col3=$3
          local col4=$4
          local col5=$5
          
          if [ $rank -eq 1 ]; then
            printf "| **#%d 🥇** | **%s** | **%s** | **%s** | **%s** |\n" $rank "$name" "$col3" "$col4" "$col5"
          elif [ $rank -eq 2 ]; then
            printf "| **#%d 🥈** | %s | %s | %s | %s |\n" $rank "$name" "$col3" "$col4" "$col5"
          elif [ $rank -eq 3 ]; then
            printf "| **#%d 🥉** | %s | %s | %s | %s |\n" $rank "$name" "$col3" "$col4" "$col5"
          else
            printf "| #%d | %s | %s | %s | %s |\n" $rank "$name" "$col3" "$col4" "$col5"
          fi
        }
        
        cat > $SUMMARY_TMP << 'HEADER'
        # 📊 DictSQLite 全バージョン ベンチマーク結果
        
        HEADER
        
        echo "> 実行日時: $(date '+%Y-%m-%d %H:%M:%S')" >> $SUMMARY_TMP
        echo "" >> $SUMMARY_TMP
        
        # ====== バージョン別総合ランキング（ポイント制） ======
        POINTS_CSV="others/benchmark/results/v2_comprehensive/version_points.csv"
        if [ -f "$POINTS_CSV" ]; then
          cat >> $SUMMARY_TMP << 'POINTS_HEADER'
        ## 🏆 バージョン別 総合ランキング
        
        各テストで1位=1点、2位=2点、3位=3点を付与（少ないほど良い）
        
        | Rank | Version | 総合ポイント | テスト数 | 平均ポイント |
        |-----:|---------|-------------:|---------:|-------------:|
        POINTS_HEADER
          
          tail -n +2 "$POINTS_CSV" | while IFS=, read -r rank version points tests avg; do
            format_rank "$rank" "$version" "$points" "$tests" "$avg" >> $SUMMARY_TMP
          done
          echo "" >> $SUMMARY_TMP
        fi
        
        # ====== スコアランキング ======
        SCORES_CSV="others/benchmark/results/v2_comprehensive/benchmark_scores.csv"
        if [ -f "$SCORES_CSV" ]; then
          cat >> $SUMMARY_TMP << 'RANK_HEADER'
        ## 📋 構成別パフォーマンスランキング
        
        | Rank | バージョン / モード | Score | Tests |
        |-----:|:--------------------|------:|------:|
        RANK_HEADER
          
          # 全結果を表示（最大30件）
          tail -n +2 "$SCORES_CSV" | head -30 | awk -F, '{
            rank=$1; name=$2; score=$3; tests=$4;
            if(rank==1) printf "| **#%d 🥇** | **%s** | **%.1f** | %d |\n", rank, name, score, tests;
            else if(rank==2) printf "| **#%d 🥈** | %s | %.1f | %d |\n", rank, name, score, tests;
            else if(rank==3) printf "| **#%d 🥉** | %s | %.1f | %d |\n", rank, name, score, tests;
            else printf "| #%d | %s | %.1f | %d |\n", rank, name, score, tests;
          }' >> $SUMMARY_TMP
          echo "" >> $SUMMARY_TMP
        fi
        
        # ====== 詳細結果テーブル ======
        DETAIL_CSV="others/benchmark/results/v2_comprehensive/benchmark_all_versions.csv"
        if [ -f "$DETAIL_CSV" ]; then
          cat >> $SUMMARY_TMP << 'DETAIL_HEADER'
        ## 📈 全テスト結果（Top 20）
        
        | Version | Category | Test | Mode/Storage | Size | Ops/sec | Score |
        |---------|----------|------|--------------|-----:|--------:|------:|
        DETAIL_HEADER
          
          # ops/sec でソートして全結果表示
          tail -n +2 "$DETAIL_CSV" | sort -t, -k8 -nr | head -20 | awk -F, '{
            printf "| %s | %s | %s | %s/%s | %s | %s | %s |\n", $1, $2, $3, $4, $5, $7, $8, $10
          }' >> $SUMMARY_TMP
          echo "" >> $SUMMARY_TMP
          
          # バージョン別統計 - 全テスト平均
          cat >> $SUMMARY_TMP << 'VER_HEADER'
        ## 📊 バージョン別 統計（全テスト平均）
        
        | Version | テスト数 | 平均スコア | 最大 Ops/sec |
        |---------|-------:|----------:|-------------:|
        VER_HEADER
          
          for version in "Original" "V2" "Fastest"; do
            result=$(tail -n +2 "$DETAIL_CSV" | grep "^$version," | awk -F, '
              BEGIN{sum=0; n=0; max=0}
              {sum+=$10; n++; if($8>max) max=$8}
              END{if(n>0) printf "%d | %.1f | %.0f", n, sum/n, max; else print "0 | 0 | 0"}
            ')
            if [ -n "$result" ]; then
              echo "| $version | $result |" >> $SUMMARY_TMP
            fi
          done
          echo "" >> $SUMMARY_TMP
          
          # バージョン別最良構成の比較
          cat >> $SUMMARY_TMP << 'BEST_CONFIG_HEADER'
        ## 🥇 バージョン別 最良構成の比較
        
        各バージョンの最速構成のみを比較（公平な比較のため）
        
        | Version | 最良構成 | テスト数 | 平均スコア | 最大 Ops/sec |
        |---------|---------|-------:|----------:|-------------:|
        BEST_CONFIG_HEADER
          
          for version in "Original" "V2" "Fastest"; do
            # 各バージョンで最も平均スコアが高い mode/storage 組み合わせを見つける
            best_config=$(tail -n +2 "$DETAIL_CSV" | grep "^$version," | awk -F, '
              {
                if($8!="" && $10!="") {
                  key=$4"/"$5
                  score[key]+=$10
                  count[key]++
                  ops=$8+0
                  if(ops>max_ops[key]) max_ops[key]=ops
                }
              }
              END{
                best_score=0
                best_key=""
                for(k in score) {
                  avg=score[k]/count[k]
                  if(avg>best_score) {
                    best_score=avg
                    best_key=k
                  }
                }
                if(best_key!="") printf "%s | %d | %.1f | %.0f", best_key, count[best_key], best_score, max_ops[best_key]
              }
            ')
            if [ -n "$best_config" ]; then
              echo "| $version | $best_config |" >> $SUMMARY_TMP
            fi
          done
          echo "" >> $SUMMARY_TMP
          
          # 全操作一覧
          cat >> $SUMMARY_TMP << 'OPS_HEADER'
        ## ⚡ 操作別 最速結果
        
        | 操作 | 最速バージョン | Ops/sec |
        |------|---------------|--------:|
        OPS_HEADER
          
          for op in "set" "get" "batch_set_100" "batch_get_100" "keys"; do
            result=$(tail -n +2 "$DETAIL_CSV" | grep ",$op," | sort -t, -k8 -nr | head -1 | awk -F, '{
              printf "%s (%s/%s) | %.0f", $1, $4, $5, $8
            }')
            if [ -n "$result" ]; then
              echo "| $op | $result |" >> $SUMMARY_TMP
            fi
          done
          echo "" >> $SUMMARY_TMP
        fi
        
        # ====== グラフ一覧 ======
        cat >> $SUMMARY_TMP << 'GRAPH_HEADER'
        ## 📉 生成グラフ（Artifacts内）
        
        GRAPH_HEADER
        
        if [ -d "others/benchmark/results/v2_comprehensive/images" ]; then
          ls -1 others/benchmark/results/v2_comprehensive/images/*.png 2>/dev/null | while read img; do
            name=$(basename "$img")
            echo "- \`$name\`" >> $SUMMARY_TMP
          done
        fi
        echo "" >> $SUMMARY_TMP
        
        # フッター
        cat >> $SUMMARY_TMP << 'FOOTER'
        ---
        
        📦 **Artifacts**: 詳細CSV、グラフPNGをダウンロード可能
        
        FOOTER
        
        echo "*Benchmark completed at $(date '+%Y-%m-%d %H:%M:%S')*" >> $SUMMARY_TMP
        
        # サマリーに追加
        cat $SUMMARY_TMP >> $GITHUB_STEP_SUMMARY
        
        # デバッグ出力
        echo "=== SUMMARY CONTENT ==="
        cat $SUMMARY_TMP

    - name: Display benchmark info
      run: |
        echo "✅ ベンチマーク実行完了！"
        echo ""
        echo "📊 結果は以下の場所で確認できます:"
        echo "  1. このワークフロー実行ページの 'Artifacts' セクション"
        echo "  2. 上部の 'Summary' タブ"
        echo "  3. リポジトリの others/benchmark/results/ ディレクトリ（コミット後）"
        echo ""
        echo "💾 結果ファイル:"
        if [ -d "others/benchmark/results" ]; then
          find others/benchmark/results -type f -name "*.csv" -o -name "*.json" -o -name "*.md" -o -name "*.png" | head -20
        fi

    - name: Commit and push benchmark results
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # ベンチマーク結果を追加
        git add others/benchmark/results/
        
        # 変更があればコミット
        if git diff --staged --quiet; then
          echo "コミットする変更がありません"
        else
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          git commit -m "📊 ベンチマーク結果を追加 - ${TIMESTAMP} [skip ci]"
          git push
          echo "✅ ベンチマーク結果をリポジトリにコミットしました"
        fi
      continue-on-error: true
