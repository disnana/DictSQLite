# パフォーマンスベンチマークワークフロー
# 
# このワークフローは負荷が大きいため、手動実行のみ許可されています。
# 実行方法: GitHub の「Actions」タブ → 「Performance Benchmark」→ 「Run workflow」
#
# テスト対象のバージョン:
# - DictSQLite (Original): dictsqlite/ フォルダ - 標準のsqlite3ベース実装
# - dictsqlite_v2: dictsqlite_v2/dictsqlite/ フォルダ - バージョン 2.0.6 (Rust拡張)
# - dictsqlite_v4.1: others/beta-versions/dictsqlite_v4.1/ - v4.1 Rust実装
# - Beta版 v1-v4: others/beta-versions/dictsqlite-fastest/beta/ - 高速ベータ版

name: Performance Benchmark

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:  # 手動実行のみ許可（負荷が大きいため）
    inputs:
      run_full_benchmark:
        description: 'フル機能ベンチマークを実行（時間がかかります）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      beta_version:
        description: 'Beta版のバージョン選択'
        required: true
        default: 'v1'
        type: choice
        options:
          - 'v1'
          - 'v2'
          - 'v3'
          - 'v4'
          - 'all'

jobs:
  # Rust拡張のビルドを並列化
  build-rust-extensions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extension:
          - name: "v4.1"
            path: "others/beta-versions/dictsqlite_v4.1"
            package: "dictsqlite_v4"
          - name: "v2"
            path: "dictsqlite_v2/dictsqlite"
            package: "dictsqlite"
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Build Rust extension for ${{ matrix.extension.name }}
      run: |
        pip install maturin
        cd ${{ matrix.extension.path }}
        echo "🔨 Building Rust ${{ matrix.extension.name }} extension..."
        echo "Current directory: $(pwd)"
        echo "Checking for Cargo.toml: $(ls -la Cargo.toml 2>&1 || echo 'NOT FOUND')"
        maturin build --release
        echo "✅ Rust ${{ matrix.extension.name }} extension built successfully"

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.extension.name }}
        path: ${{ matrix.extension.path }}/target/wheels/*.whl
        retention-days: 1

  benchmark:
    needs: build-rust-extensions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/others/beta-versions/dictsqlite-fastest:${{ github.workspace }}/others/beta-versions/dictsqlite-fastest/beta:${{ github.workspace }}/dictsqlite_v2/dictsqlite/python

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk fonts-ipafont fonts-ipaexfont

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install matplotlib seaborn pandas numpy plotly kaleido
        # dictsqlite-fastest の依存関係（apsw, zstandard等）
        pip install apsw zstandard
        # v2用の依存関係（aiosqlite）
        pip install aiosqlite
        pip install -e .
        # dictsqlite-fastest の依存関係をインストール（パッケージとしてではなく）
        if [ -f "others/beta-versions/dictsqlite-fastest/requirements.txt" ]; then
          pip install -r others/beta-versions/dictsqlite-fastest/requirements.txt
        fi
        # dictsqlite-fastest beta の依存関係をインストール
        if [ -f "others/beta-versions/dictsqlite-fastest/beta/requirements.txt" ]; then
          pip install -r others/beta-versions/dictsqlite-fastest/beta/requirements.txt
        fi
        pip install maturin

    - name: Download v4.1 wheel
      uses: actions/download-artifact@v4
      with:
        name: wheel-v4.1
        path: ./wheels/v4.1

    - name: Download v2 wheel
      uses: actions/download-artifact@v4
      with:
        name: wheel-v2
        path: ./wheels/v2

    - name: Install Rust extensions
      run: |
        echo "📦 Installing Rust v4.1 extension..."
        # Verify exactly one wheel file exists
        WHEEL_COUNT=$(ls -1 ./wheels/v4.1/dictsqlite_v4-*.whl 2>/dev/null | wc -l)
        if [ "$WHEEL_COUNT" -eq 0 ]; then
          echo "❌ Error: No v4.1 wheel file found"
          exit 1
        elif [ "$WHEEL_COUNT" -gt 1 ]; then
          echo "⚠️ Warning: Multiple v4.1 wheel files found, using first one"
          ls -1 ./wheels/v4.1/dictsqlite_v4-*.whl
        fi
        pip install --force-reinstall ./wheels/v4.1/dictsqlite_v4-*.whl
        echo "✅ Rust v4.1 extension installed"
        
        echo "📦 Installing dictsqlite_v2 extension..."
        # Verify exactly one wheel file exists
        WHEEL_COUNT=$(ls -1 ./wheels/v2/dictsqlite-*.whl 2>/dev/null | wc -l)
        if [ "$WHEEL_COUNT" -eq 0 ]; then
          echo "❌ Error: No v2 wheel file found"
          exit 1
        elif [ "$WHEEL_COUNT" -gt 1 ]; then
          echo "⚠️ Warning: Multiple v2 wheel files found, using first one"
          ls -1 ./wheels/v2/dictsqlite-*.whl
        fi
        pip install --force-reinstall ./wheels/v2/dictsqlite-*.whl
        echo "✅ dictsqlite_v2 extension installed"

    - name: Display version information
      run: |
        echo "=== バージョン情報 ==="
        echo "Python: $(python --version)"
        echo ""
        echo "DictSQLite (Original):"
        python -c "import dictsqlite.main; print(f'  Version: {dictsqlite.main.__version__}')" || echo "  インポートエラー"
        echo ""
        echo "dictsqlite_v2 (Rust拡張):"
        echo "  pyproject.toml バージョン: 2.0.6"
        python -c "import dictsqlite; print(f'  インポート成功')" || echo "  インポートエラー"
        echo ""
        echo "dictsqlite_v4.1 (Rust拡張):"
        python -c "from dictsqlite_v4 import DictSQLiteV4; print(f'  インポート成功')" || echo "  インポートエラー"
        echo ""
        echo "Beta Version: ${{ github.event.inputs.beta_version }}"
        echo "======================================"

    - name: Run fast comprehensive benchmark
      run: |
        cd others/benchmark
        
        # Beta版のバージョンに応じてインポートを変更
        BETA_VERSION="${{ github.event.inputs.beta_version }}"
        echo "📦 選択されたBeta版: $BETA_VERSION"
        
        # BETA_VERSIONを環境変数としてエクスポート（バージョン管理システムで使用）
        export BETA_VERSION
        
        # 結果ディレクトリを事前に作成
        mkdir -p results/versions
        mkdir -p results/graphs
        mkdir -p results/comparisons
        
        if [ "$BETA_VERSION" == "all" ]; then
          echo "🔬 全バージョン (Original, Beta v2, v4.1) の比較ベンチマークを実行..."
          python run_benchmark.py --beta all || {
            echo "❌ ベンチマーク実行エラー"
            echo "エラーログを確認してください"
            exit 1
          }
        elif [ "$BETA_VERSION" == "v2" ]; then
          echo "🔄 ベンチマークスクリプトをv2用に変更..."
          sed -i 's/from dictsqlite_fastest_beta import/from dictsqlite_fastest_beta_v2 import/g' comprehensive_benchmark.py || true
          sed -i 's/from dictsqlite_fastest_beta import/from dictsqlite_fastest_beta_v2 import/g' fast_comprehensive_benchmark.py || true
          
          if [ "${{ github.event.inputs.run_full_benchmark }}" == "true" ]; then
            echo "🔬 フル機能ベンチマーク (v2) を実行中..."
            python comprehensive_benchmark.py || {
              echo "❌ ベンチマーク実行エラー"
              exit 1
            }
          else
            echo "⚡ 高速ベンチマーク (v2) を実行中..."
            python fast_comprehensive_benchmark.py || {
              echo "❌ ベンチマーク実行エラー"
              exit 1
            }
          fi
        elif [ "$BETA_VERSION" == "v3" ]; then
          echo "🔄 ベンチマークスクリプトをv3-alpha用に変更..."
          sed -i 's/from dictsqlite_fastest_beta import/from dictsqlite_fastest_beta_v3_alpha import/g' comprehensive_benchmark.py || true
          sed -i 's/from dictsqlite_fastest_beta import/from dictsqlite_fastest_beta_v3_alpha import/g' fast_comprehensive_benchmark.py || true
          
          if [ "${{ github.event.inputs.run_full_benchmark }}" == "true" ]; then
            echo "🔬 フル機能ベンチマーク (v3) を実行中..."
            python comprehensive_benchmark.py || {
              echo "❌ ベンチマーク実行エラー"
              exit 1
            }
          else
            echo "⚡ 高速ベンチマーク (v3) を実行中..."
            python fast_comprehensive_benchmark.py || {
              echo "❌ ベンチマーク実行エラー"
              exit 1
            }
          fi
        elif [ "$BETA_VERSION" == "v4" ]; then
          echo "🔄 ベンチマークスクリプトをv4-final用に変更..."
          sed -i 's/from dictsqlite_fastest_beta import/from dictsqlite_fastest_beta_v4_final import/g' comprehensive_benchmark.py || true
          sed -i 's/from dictsqlite_fastest_beta import/from dictsqlite_fastest_beta_v4_final import/g' fast_comprehensive_benchmark.py || true
          
          if [ "${{ github.event.inputs.run_full_benchmark }}" == "true" ]; then
            echo "🔬 フル機能ベンチマーク (v4) を実行中..."
            python comprehensive_benchmark.py || {
              echo "❌ ベンチマーク実行エラー"
              exit 1
            }
          else
            echo "⚡ 高速ベンチマーク (v4) を実行中..."
            python fast_comprehensive_benchmark.py || {
              echo "❌ ベンチマーク実行エラー"
              exit 1
            }
          fi
        else
          # v1の場合
          if [ "${{ github.event.inputs.run_full_benchmark }}" == "true" ]; then
            echo "🔬 フル機能ベンチマーク (v1) を実行中..."
            python comprehensive_benchmark.py || {
              echo "❌ ベンチマーク実行エラー"
              exit 1
            }
          else
            echo "⚡ 高速ベンチマーク (v1) を実行中..."
            python fast_comprehensive_benchmark.py || {
              echo "❌ ベンチマーク実行エラー"
              exit 1
            }
          fi
        fi
        
        # CSV ファイルの検証
        echo "📊 CSV ファイルの検証..."
        if ls results/*.csv 1> /dev/null 2>&1; then
          for csv_file in results/*.csv; do
            if [ -f "$csv_file" ]; then
              lines=$(wc -l < "$csv_file")
              echo "  ✓ $csv_file ($lines lines)"
            fi
          done
        else
          echo "  ⚠️ CSV ファイルが見つかりません"
        fi
      env:
        BETA_VERSION: ${{ github.event.inputs.beta_version }}
      continue-on-error: false

    # グラフはベンチマーク実行時に自動生成されるため、このステップは不要
    
    - name: Generate version comparison
      run: |
        cd others/benchmark
        echo "📊 バージョン間比較を生成中..."
        python compare_versions.py || echo "⚠️ バージョン比較の生成に失敗しました（初回実行の場合は正常）"
      continue-on-error: true

    - name: List benchmark results
      run: |
        echo "=== Benchmark Results (Beta Version: ${{ github.event.inputs.beta_version }}) ==="
        ls -lh others/benchmark/results/
        echo ""
        echo "=== Version-specific Results ==="
        if [ -d "others/benchmark/results/versions" ]; then
          ls -lh others/benchmark/results/versions/
          echo ""
          echo "=== Files in Version Directory ==="
          VERSION_DIR="others/benchmark/results/versions/${{ github.event.inputs.beta_version }}"
          if [ -d "$VERSION_DIR" ]; then
            ls -lh "$VERSION_DIR"/
            if [ -d "$VERSION_DIR/graphs" ]; then
              echo ""
              echo "=== Graphs in Version Directory ==="
              ls -lh "$VERSION_DIR/graphs/"
            fi
          fi
        fi
        echo ""
        echo "=== Version Comparisons ==="
        if [ -d "others/benchmark/results/comparisons" ]; then
          ls -lh others/benchmark/results/comparisons/
        fi

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-${{ matrix.python-version }}
        path: |
          others/benchmark/results/*.csv
          others/benchmark/results/*.json
          others/benchmark/results/*.log
          others/benchmark/results/*.md
          others/benchmark/results/graphs/*.png
          others/benchmark/results/graphs/*.html
          others/benchmark/results/versions/**/*
          others/benchmark/results/comparisons/**/*
        retention-days: 90

    - name: Create benchmark summary
      run: |
        SUMMARY_FILE="others/benchmark/results/BENCHMARK_SUMMARY.md"
        if [ -f "$SUMMARY_FILE" ]; then
          echo "## 📊 Benchmark Results" >> $GITHUB_STEP_SUMMARY
          cat "$SUMMARY_FILE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*手動実行されたベンチマーク - $(date)*" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Display benchmark info
      run: |
        echo "✅ ベンチマーク実行完了！"
        echo ""
        echo "📊 結果は以下の場所で確認できます:"
        echo "  1. このワークフロー実行ページの 'Artifacts' セクション"
        echo "  2. 上部の 'Summary' タブ"
        echo "  3. リポジトリの others/benchmark/results/ ディレクトリ（コミット後）"
        echo ""
        echo "💾 結果ファイル:"
        if [ -d "others/benchmark/results" ]; then
          find others/benchmark/results -type f -name "*.csv" -o -name "*.json" -o -name "*.md" -o -name "*.png" | head -20
        fi

    - name: Commit and push benchmark results
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # ベンチマーク結果を追加
        git add others/benchmark/results/
        
        # 変更があればコミット
        if git diff --staged --quiet; then
          echo "コミットする変更がありません"
        else
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          git commit -m "📊 ベンチマーク結果を追加 - ${TIMESTAMP} [skip ci]"
          git push
          echo "✅ ベンチマーク結果をリポジトリにコミットしました"
        fi
      continue-on-error: true
