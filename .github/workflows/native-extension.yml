name: Build Native Extension

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'dictsqlite_native/**'
      - '.github/workflows/native-extension.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'dictsqlite_native/**'
      - '.github/workflows/native-extension.yml'
  workflow_dispatch:

jobs:
  test-fallback:
    name: Test Pure Python Fallback
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest portalocker cryptography
    
    - name: Test without native extension
      run: |
        python -c "from dictsqlite.native_wrapper import is_native_available; assert not is_native_available()"
        pytest tests/test_native_extension.py -v
  
  build-and-test:
    name: Build and Test Native Extension
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin pytest portalocker cryptography
    
    - name: Build native extension
      run: |
        cd dictsqlite_native
        maturin build --release
    
    - name: Install built wheel
      shell: bash
      run: |
        pip install dictsqlite_native/target/wheels/*.whl
    
    - name: Test with native extension
      run: |
        python -c "from dictsqlite.native_wrapper import is_native_available; assert is_native_available(), 'Native extension should be available'"
        pytest tests/test_native_extension.py -v
    
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
        path: dictsqlite_native/target/wheels/*.whl

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin portalocker cryptography
    
    - name: Build and install native extension
      run: |
        cd dictsqlite_native
        maturin build --release
        pip install target/wheels/*.whl
    
    - name: Run performance benchmark
      run: |
        python example_native_extension.py
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: |
          *.md
          *.txt
