name: PyPI Release (v2)

on:
  push:
    branches:
      - main
    # 以下のファイル・ディレクトリが変更されたときだけ実行
    paths:
      - '.github/workflows/pypi_release.yml'
      - 'dictsqlite_v2/**'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          # Cargo.toml があるディレクトリを指定（ここが重要）
          working-directory: dictsqlite_v2
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dictsqlite_v2/dist/*.whl

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          working-directory: dictsqlite_v2
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dictsqlite_v2/dist/*.whl

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          working-directory: dictsqlite_v2
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: dictsqlite_v2/dist/*.whl

  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages_dir: dist
          # skip_existing: true # すでに同じバージョンがある場合にエラーにしない設定（必要ならコメントアウト解除）
