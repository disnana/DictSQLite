name: Cargo Deny

on:
  push:
  pull_request:

jobs:
  cargo-deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          manifest-path: ./dictsqlite_v4.1/Cargo.toml
          command: check advisories bans sources
          arguments: --all-features
          command-arguments: --config ../others/deny.toml
