name: DictSQLite v4.2 Performance Tests (Manual)
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of iterations per test'
        required: false
        default: '3'

jobs:
  build-and-test:
    name: Build and Performance Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      
      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            others/beta-versions/dictsqlite_v4.2/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio
      
      - name: Build DictSQLite v4.2
        working-directory: others/beta-versions/dictsqlite_v4.2
        run: |
          chmod +x build.sh
          ./build.sh
        env:
          CI: true
      
      - name: Run comprehensive performance tests
        working-directory: others/beta-versions/dictsqlite_v4.2
        run: |
          python tests/test_v4.2_comprehensive_performance.py \
            --iterations ${{ github.event.inputs.iterations || '3' }} \
            --output performance_results_${{ matrix.os }}_py${{ matrix.python-version }}.json
      
      - name: Run pytest on entire tests folder
        working-directory: others/beta-versions/dictsqlite_v4.2
        run: |
          pytest tests/ -v --tb=short
      
      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: others/beta-versions/dictsqlite_v4.2/performance_results_*.json
          retention-days: 30
  
  benchmark-comparison:
    name: Benchmark v4.1 vs v4.2
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin
      
      - name: Build v4.1
        working-directory: others/beta-versions/dictsqlite_v4.1
        run: |
          maturin build --release --strip
          pip install --force-reinstall target/wheels/*.whl
      
      - name: Run v4.1 baseline tests
        working-directory: others/beta-versions/dictsqlite_v4.1
        run: |
          python tests/verify_optimization_opportunities.py > v4.1_results.txt || true
      
      - name: Build v4.2
        working-directory: others/beta-versions/dictsqlite_v4.2
        run: |
          maturin build --release --strip
          pip install --force-reinstall target/wheels/*.whl
      
      - name: Run v4.2 optimized tests
        working-directory: others/beta-versions/dictsqlite_v4.2
        run: |
          python tests/test_v4.2_comprehensive_performance.py \
            --iterations 5 \
            --output v4.2_results.json
      
      - name: Generate comparison report
        run: |
          python3 << 'EOF'
          import json
          import os
          
          print("="*80)
          print("DictSQLite v4.1 vs v4.2 Performance Comparison")
          print("="*80)
          
          # Try to load v4.2 results
          v42_file = "others/beta-versions/dictsqlite_v4.2/v4.2_results.json"
          if os.path.exists(v42_file):
              with open(v42_file) as f:
                  v42_data = json.load(f)
              
              print(f"\nv4.2 Test Results ({v42_data.get('timestamp', 'N/A')}):")
              print(f"Total tests: {len(v42_data.get('tests', {}))}")
              
              # Show key performance metrics
              tests = v42_data.get('tests', {})
              for test_name in sorted(tests.keys()):
                  test_data = tests[test_name]
                  print(f"  {test_name}: {test_data['avg_time']:.3f}s")
          else:
              print("v4.2 results not found")
          
          print("\n" + "="*80)
          EOF
      
      - name: Upload comparison results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: |
            others/beta-versions/dictsqlite_v4.1/v4.1_results.txt
            others/beta-versions/dictsqlite_v4.2/v4.2_results.json
          retention-days: 30

  security-check:
    name: Security and Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      
      - name: Run Clippy
        working-directory: others/beta-versions/dictsqlite_v4.2
        run: cargo clippy -- -D warnings || true
      
      - name: Run Cargo Audit
        working-directory: others/beta-versions/dictsqlite_v4.2
        run: |
          cargo install cargo-audit || true
          cargo audit || true
      
      - name: Check formatting
        working-directory: others/beta-versions/dictsqlite_v4.2
        run: cargo fmt --check || true
